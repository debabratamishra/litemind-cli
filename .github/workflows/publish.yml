name: Publish to PyPI (tag safety net)

# This workflow is a safety net only.
# The primary release flow is handled by release.yml (workflow_dispatch or
# pyproject.toml push to main). This workflow fires if a v* tag is pushed
# manually outside of the release.yml flow, ensuring PyPI always stays in sync.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Tag: $TAG  pyproject: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag ($TAG) does not match pyproject version ($PKG)."
            exit 1
          fi

      - name: Check if GitHub Release already exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG already exists — skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes with git-cliff
        if: steps.check_release.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Build distributions
        if: steps.check_release.outputs.exists == 'false'
        run: uv build

      - name: Publish to PyPI (trusted publishing / OIDC)
        if: steps.check_release.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
