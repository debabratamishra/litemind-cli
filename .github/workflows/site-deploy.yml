name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix site

      - name: Build static site
        run: npm run build --prefix site

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
          git config --global user.signingkey ${{ secrets.GPG_KEY_ID }}
          git config --global commit.gpgsign true

      - name: Deploy to temp branch and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf docs
          mkdir -p docs
          cp -r site/out/* docs/
          touch docs/.nojekyll

          BRANCH_NAME="gh-pages-deploy-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" add docs/
          if ! git diff --quiet --cached; then
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -S -m "Deploy GitHub Pages site [skip ci]"
            git push origin "$BRANCH_NAME"
            gh pr create \
              --title "Deploy GitHub Pages (run ${{ github.run_id }})" \
              --body "Automated PR from the site‑deploy workflow." \
              --base main \
              --head "$BRANCH_NAME" \
              --label "autodeploy" \
              --auto-merge --merge-method merge
          else
            echo "No changes to deploy"
          fi